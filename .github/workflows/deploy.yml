name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main  # Atau branch yang sesuai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Atau versi Node.js yang sesuai

      - name: Install dependencies
        run: npm install  # Install dependencies

      - name: Set up Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler config --api-token $CF_API_TOKEN

      - name: Deploy to Cloudflare Workers
        run: wrangler publish  # Deploy aplikasi ke Cloudflare Workers
