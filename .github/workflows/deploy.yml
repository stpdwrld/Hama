name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main  # Workflow akan dijalankan pada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Menentukan versi Node.js

      - name: Install dependencies
        run: |
          npm install  # Install dependencies

      - name: Run wrangler config
        run: |
          wrangler config --api-token ${{ secrets.CF_API_TOKEN }}  # Menggunakan token API Cloudflare

      - name: Deploy to Cloudflare Workers
        run: |
          wrangler publish  # Deploy aplikasi ke Cloudflare Workers
